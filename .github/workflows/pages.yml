name: Collect and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect recent days and older gaps
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/collect_recent.py
      - name: Preserve records and diagnostics
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data archive
          if ! git diff --cached --quiet; then
            git commit -m 'Archive PUCSL dispatch observations'
            git push
          fi
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_charts.js tests/test_exports.js
      - name: Prepare public site
        run: |
          mkdir -p public
          cp index.html style.css app.js analysis.js holidays.js exports.js sw.js manifest.webmanifest icon.svg sample-template.csv public/
          cp -r icons data public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  report-collection-failure:
    if: always() && needs.build.outputs.collection_outcome == 'failure'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Collection had errors. Review archive/api-last-run.json, archive/backfill-last-run.json and workflow logs.' && exit 1
